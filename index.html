<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Roll20 Chat Archive
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<header class="top">


<h1>
Roll20 Chat Archive
</h1>


<p>
TRPG 로그 정리 · 롤꾸 보존 · PDF / 티스토리 변환
</p>


</header>





<div class="layout">





<!-- ==================
     입력 영역
================== -->


<section class="input-area">


<h2>
로그 입력
</h2>



<div class="upload-box">


<label for="fileInput">

📂 로그 파일 업로드

</label>


<input
type="file"
id="fileInput"
hidden
>


</div>





<textarea
id="logInput"
placeholder="
Roll20 채팅 로그를 붙여넣으세요.
"
></textarea>





<div class="button-group">


<button id="parseBtn">

변환

</button>


<button id="cleanBtn">

자동 교정

</button>



<button id="copyBtn">

HTML 복사

</button>



<button id="backupBtn">

백업

</button>



<button id="txtBtn">

TXT 저장

</button>



<button id="pdfBtn">

PDF

</button>


</div>



</section>









<!-- ==================
     로그 화면
================== -->


<section class="viewer">


<div class="viewer-header">


<h2>
Archive
</h2>



<input
id="searchInput"
placeholder="검색..."
>


</div>





<div
id="preview"
class="log-container"
>


<div class="empty">

로그를 입력해주세요.

</div>


</div>



</section>









<!-- ==================
     통계 영역
================== -->


<aside class="side">


<section>


<h3>
통계
</h3>


<div id="statistics">

아직 없음

</div>


</section>





<section>


<h3>
캐릭터
</h3>


<div id="characters">


</div>


<button id="deleteBtn">

선택 캐릭터 삭제

</button>


</section>



</aside>







</div>








<!-- JS 순서 중요 -->


<script src="js/parser.js"></script>

<script src="js/cleaner.js"></script>

<script src="js/stats.js"></script>

<script src="js/renderer.js"></script>

<script src="js/exporter.js"></script>

<script src="app.js"></script>



</body>

</html>
