<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
TRPG Log Studio
</title>


<link rel="stylesheet"
href="style.css">


</head>


<body>


<header class="header">


<h1>
TRPG Log Studio
</h1>


<p>
Roll20 로그 보존 및 정리 도구
</p>


</header>





<div class="app">



<!-- =========================
     사이드바
========================= -->


<aside class="sidebar">



<section class="panel">


<h2>
파일
</h2>



<input

type="file"

id="fileInput"

accept=".txt,.html,.htm"

hidden

>


<button
onclick="
document.querySelector('#fileInput').click()
"
>

파일 불러오기

</button>



</section>







<section class="panel actions">


<h2>
변환
</h2>



<button id="parseBtn">

변환

</button>



<button id="cleanBtn">

자동 정리

</button>



<button id="copyBtn">

티스토리 HTML 복사

</button>



<button id="backupBtn">

JSON 백업

</button>



<button id="txtBtn">

TXT 저장

</button>



<button id="pdfBtn">

PDF 출력

</button>



</section>







<section class="panel">


<h2>
캐릭터
</h2>



<p class="help">

로그를 입력하면 캐릭터가 자동 생성됩니다.

</p>



<div

id="characters"

class="character-list"

>

</div>



<button

id="deleteBtn"

class="danger"

>

선택 캐릭터 삭제

</button>



</section>







<section class="panel">


<h2>
테마 설정
</h2>



<label>

배경색

<input

type="color"

id="bgColor"

value="#ffffff"

>

</label>




<label>

글자색

<input

type="color"

id="textColor"

value="#222222"

>

</label>




<label>

채팅 박스

<input

type="color"

id="chatColor"

value="#f5f5f5"

>

</label>




<button

id="applyTheme"

>

테마 적용

</button>



</section>







<section class="panel">


<h2>
통계
</h2>



<div

id="statistics"

>

아직 없음

</div>



</section>



</aside>









<!-- =========================
     메인
========================= -->


<main class="main">



<section class="panel">


<input

id="searchInput"

class="search"

placeholder="로그 검색"

>


</section>








<section

id="preview"

class="log-container"

>


<div class="empty">

로그를 입력해주세요.

</div>


</section>





</main>



</div>








<script src="js/character.js"></script>

<script src="js/characterExtractor.js"></script>

<script src="js/htmlParser.js"></script>

<script src="js/parser.js"></script>

<script src="js/cleaner.js"></script>

<script src="js/renderer.js"></script>

<script src="js/stats.js"></script>

<script src="js/exporter.js"></script>

<script src="js/app.js"></script>


</body>

</html>
