<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
TRPG Log Studio
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<header class="header">

<h1>
TRPG Log Studio
</h1>

<p class="help">
Roll20 채팅 로그를 정리하고 캐릭터별로 관리하는 아카이브 도구
</p>

</header>




<div class="app">



<!-- ======================
사이드바
====================== -->


<aside class="sidebar">



<section class="panel">


<h2>
로그 입력
</h2>



<textarea

id="logInput"

class="log-input"

placeholder="
Roll20 HTML 또는 텍스트 로그를 붙여넣으세요.

예:
캐릭터명: 대사

또는 Roll20 채팅 HTML 전체 복사

"

></textarea>



<input

type="file"

id="fileInput"

accept=".txt,.html,.htm"

hidden

>



<div class="actions">


<button
id="parseBtn"
>
변환
</button>



<button
id="cleanBtn"
>
자동 정리
</button>



</div>


</section>






<section class="panel">


<h2>
내보내기
</h2>


<div class="actions">


<button
id="copyBtn"
>
티스토리 HTML 복사
</button>



<button
id="backupBtn"
>
JSON 백업
</button>



<button
id="txtBtn"
>
TXT 저장
</button>



<button
id="pdfBtn"
>
PDF 출력
</button>



</div>


</section>








<section class="panel">


<h2>
검색
</h2>



<input

id="searchInput"

class="search"

placeholder="로그 검색"

>


</section>








<section class="panel">


<h2>
캐릭터 관리
</h2>



<div

id="characters"

class="character-list"

>

</div>



<button

id="deleteBtn"

class="danger"

>
선택 캐릭터 삭제
</button>


</section>








<section class="panel">


<h2>
테마 설정
</h2>



<div class="theme-row">


<label>

배경

<input

type="color"

id="bgColor"

value="#ffffff"

>

</label>



<label>

글자

<input

type="color"

id="textColor"

value="#222222"

>

</label>



<label>

채팅

<input

type="color"

id="chatColor"

value="#f5f5f5"

>

</label>



</div>




<button

id="applyTheme"

>
테마 적용
</button>



</section>





<section class="panel">


<h2>
통계
</h2>



<div

id="statistics"

>

아직 없음

</div>



</section>




</aside>








<!-- ======================
본문
====================== -->


<main class="main">


<section class="panel">


<h2>
로그 미리보기
</h2>



<div

id="preview"

class="log-container"

>

로그를 입력해주세요.

</div>


</section>



</main>





</div>







<script src="js/character.js"></script>

<script src="js/characterExtractor.js"></script>

<script src="js/htmlParser.js"></script>

<script src="js/parser.js"></script>

<script src="js/cleaner.js"></script>

<script src="js/stats.js"></script>

<script src="js/renderer.js"></script>

<script src="js/exporter.js"></script>

<script src="js/app.js"></script>



</body>

</html>
