<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Roll20 Chat Archive
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<header class="top">

<h1>
Roll20 Chat Archive
</h1>


<p>
Roll20 로그 정리 · 롤꾸 보존 · PDF / 티스토리 변환
</p>

</header>





<main class="layout">





<!-- =====================
 입력 패널
===================== -->


<section class="input-area panel">


<h2>
📂 로그 입력
</h2>



<div class="upload-box">


<label for="fileInput">

파일 불러오기

</label>


<input

type="file"

id="fileInput"

accept=".txt,.html,.htm"

hidden

>


</div>






<textarea

id="logInput"

placeholder="
Roll20 Chat Archive를 붙여넣으세요.

HTML 로그도 가능합니다.
"

></textarea>





<div class="button-group">


<button id="parseBtn">

변환

</button>


<button id="cleanBtn">

자동 교정

</button>


<button id="copyBtn">

티스토리 HTML 복사

</button>


<button id="backupBtn">

JSON 백업

</button>


<button id="txtBtn">

TXT 저장

</button>


<button id="pdfBtn">

PDF 출력

</button>



</div>


</section>









<!-- =====================
 로그 출력
===================== -->


<section class="viewer panel">


<div class="viewer-header">


<h2>
📖 Archive
</h2>



<input

id="searchInput"

placeholder="로그 검색"

>


</div>





<div

id="preview"

class="log-container"

>


<div class="empty">

로그를 입력해주세요.

</div>


</div>


</section>









<!-- =====================
 캐릭터 패널
===================== -->


<aside class="side">





<section class="panel">


<h3>

🎭 캐릭터 관리

</h3>



<p class="help">

로그를 입력하면 캐릭터가 자동 생성됩니다.

</p>



<div

id="characters"

>


</div>


</section>







<section class="panel">


<h3>

📊 통계

</h3>


<div

id="statistics"

>

아직 없음

</div>



</section>





</aside>



</main>









<!-- =====================
 Script
===================== -->


<script src="js/parser.js"></script>

<script src="js/cleaner.js"></script>

<script src="js/stats.js"></script>

<script src="js/character.js"></script>

<script src="js/renderer.js"></script>

<script src="js/exporter.js"></script>

<script src="app.js"></script>



</body>

</html>
