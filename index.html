<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
TRPG Log Studio
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<header class="header">

<h1>
🎲 TRPG Log Studio
</h1>

<p>
Roll20 로그 정리 및 백업 도구
</p>

</header>




<main class="layout">


<!-- =========================
입력 영역
========================= -->


<section class="panel input-panel">


<h2>
📥 로그 입력
</h2>



<textarea

id="logInput"

placeholder="
Roll20 채팅 로그를 붙여넣으세요.
HTML 복사도 가능합니다.
"

></textarea>




<div class="file-area">


<label>

파일 불러오기

<input

type="file"

id="fileInput"

accept=".txt,.html,.htm"

hidden

>

</label>


</div>





<div class="button-group">


<button id="parseBtn">

변환

</button>



<button id="cleanBtn">

자동 정리

</button>



<button id="copyBtn">

티스토리 HTML 복사

</button>


<button id="backupBtn">

JSON 백업

</button>


<button id="txtBtn">

TXT 저장

</button>


<button id="pdfBtn">

PDF 출력

</button>



</div>


</section>







<!-- =========================
검색
========================= -->


<section class="panel">


<h2>
🔎 검색
</h2>


<input

id="searchInput"

placeholder="로그 검색"

>


</section>







<!-- =========================
캐릭터 관리
========================= -->


<section class="panel">


<h2>
🎭 캐릭터 관리
</h2>


<p>

로그를 입력하면 캐릭터가 자동 생성됩니다.

</p>



<div

id="characters"

class="character-list"

>

</div>




<button

id="deleteBtn"

>

선택 캐릭터 삭제

</button>



</section>








<!-- =========================
테마 설정
========================= -->


<section class="panel">


<h2>
🎨 컬러 설정
</h2>



<div class="color-setting">


<label>

배경색

<input

type="color"

id="bgColor"

value="#ffffff"

>

</label>




<label>

글자색

<input

type="color"

id="textColor"

value="#222222"

>

</label>




<label>

채팅 박스

<input

type="color"

id="chatColor"

value="#f5f5f5"

>

</label>



</div>




<button

id="applyTheme"

>

테마 적용

</button>



</section>








<!-- =========================
로그 출력
========================= -->


<section class="panel">


<h2>
📜 로그 미리보기
</h2>



<div

id="preview"

class="log-container"

>

로그를 입력해주세요.

</div>



</section>








<!-- =========================
통계
========================= -->


<section class="panel">


<h2>
📊 통계
</h2>


<div

id="statistics"

>

아직 없음

</div>


</section>



</main>






<script src="js/character.js"></script>

<script src="js/characterExtractor.js"></script>

<script src="js/htmlParser.js"></script>

<script src="js/parser.js"></script>

<script src="js/cleaner.js"></script>

<script src="js/renderer.js"></script>

<script src="js/stats.js"></script>

<script src="js/exporter.js"></script>

<script src="js/theme.js"></script>

<script src="app.js"></script>



</body>

</html>
