<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
TRPG Log Studio
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

<h1>
TRPG Log Studio
</h1>

<p class="help">
Roll20 로그를 붙여넣거나 파일로 불러와 정리합니다.
</p>

</header>




<div class="app">



<!-- =====================
사이드바
===================== -->

<aside class="sidebar">



<section class="panel">

<h2>
로그 입력
</h2>


<textarea

id="logInput"

class="log-input"

placeholder="
Roll20 채팅 HTML 또는 텍스트 로그를 붙여넣으세요.

예:
캐릭터명: 대사

HTML 복사도 지원됩니다.
"

></textarea>



<input

type="file"

id="fileInput"

accept=".txt,.html,.htm"

hidden

>


<button
id="parseBtn"
>
변환
</button>



<button
id="cleanBtn"
>
자동 정리
</button>



</section>






<section class="panel actions">


<h2>
내보내기
</h2>


<button
id="copyBtn"
>
티스토리 HTML 복사
</button>


<button
id="backupBtn"
>
JSON 백업
</button>


<button
id="txtBtn"
>
TXT 저장
</button>


<button
id="pdfBtn"
>
PDF 출력
</button>



</section>






<section class="panel">


<h2>
검색
</h2>


<input

id="searchInput"

class="search"

placeholder="로그 검색"

>


</section>







<section class="panel">


<h2>
캐릭터
</h2>


<p class="help">
로그 분석 후 캐릭터가 자동 생성됩니다.
</p>



<div

id="characters"

class="character-list"

></div>



<button

id="deleteBtn"

class="danger"

>
선택 캐릭터 삭제
</button>


</section>








<section class="panel">


<h2>
테마
</h2>


<label>
배경색
<input

type="color"

id="bgColor"

value="#ffffff"

>
</label>


<br>


<label>
글자색
<input

type="color"

id="textColor"

value="#222222"

>
</label>


<br>


<label>
채팅 박스
<input

type="color"

id="chatColor"

value="#f5f5f5"

>
</label>



<button

id="applyTheme"

>
테마 적용
</button>



</section>




</aside>







<!-- =====================
메인
===================== -->

<main class="main">



<section class="panel">


<h2>
로그 미리보기
</h2>


<div

id="preview"

class="log-container"

>

로그를 입력해주세요.

</div>


</section>







<section class="panel">


<h2>
통계
</h2>


<div

id="statistics"

>

아직 없음

</div>


</section>



</main>



</div>





<script src="js/character.js"></script>

<script src="js/characterExtractor.js"></script>

<script src="js/htmlParser.js"></script>

<script src="js/parser.js"></script>

<script src="js/cleaner.js"></script>

<script src="js/renderer.js"></script>

<script src="js/stats.js"></script>

<script src="js/exporter.js"></script>

<script src="js/app.js"></script>


</body>

</html>
